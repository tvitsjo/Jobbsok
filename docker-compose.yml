services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobbsok
      POSTGRES_PASSWORD: jobbsok
      POSTGRES_DB: jobbsok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - db

  worker:
    build: ./backend
    command: python -m app.worker
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
