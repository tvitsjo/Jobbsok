databases:
  - name: jobbsok-db
    plan: free
    databaseName: jobbsok
    user: jobbsok

services:
  - type: web
    name: jobbsok
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobbsok-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: truls.aasberg@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: truls.aasberg@gmail.com
      - key: FRONTEND_URL
        value: https://jobbsok.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
